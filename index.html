<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1b2a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Cuntur · Ruta de los 5 Sabores</title>
  <meta name="author" content="David Cevallos — https://davidcevallos.vercel.app/" />
  <meta name="description" content="Videojuego 2D de un cóndor andino que recorre la Costa, Galápagos, la Sierra, los volcanes y la Amazonía del Ecuador buscando su comida típica. Desarrollado por David Cevallos." />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./favicon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Cuntur · Ruta de los 5 Sabores" />
  <meta property="og:description" content="Un cóndor andino, 5 regiones del Ecuador y su comida típica. Juega gratis en el navegador, en el celular o en la PC." />
  <meta property="og:url" content="https://cuntur-ruta-de-los-5-sabores.vercel.app/" />
  <meta property="og:image" content="https://cuntur-ruta-de-los-5-sabores.vercel.app/og.png" />
  <meta property="og:locale" content="es_EC" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    :root { color-scheme: dark; --bg: #0d1b2a; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; overscroll-behavior: none; }
    #game { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #game canvas { display: block; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: var(--bg); color: #f4ead5;
      font: 600 18px/1.4 system-ui, sans-serif; text-align: center; align-items: center; justify-content: center; flex-direction: column; gap: 16px; padding: 24px; }
    #rotate .phone { width: 44px; height: 76px; border: 4px solid #f4ead5; border-radius: 10px; animation: turn 2.2s ease-in-out infinite; }
    @keyframes turn { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
    @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate" role="alert"><div class="phone"></div><div>Gira tu celular para jugar</div></div>
  <noscript>Este juego necesita JavaScript.</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
